[package]
name = "edgequake-query"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Query engine for EdgeQuake RAG system"

[features]
default = []

[dependencies]
edgequake-core = { path = "../edgequake-core", default-features = false }
edgequake-storage = { path = "../edgequake-storage", default-features = false }
edgequake-llm = { workspace = true }
# Jina code-embedder client for Phase 1 query-time enrichment.
edgequake-agents = { workspace = true }

async-trait.workspace = true
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures = "0.3"

# SOTA keyword extraction dependencies
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json.workspace = true
