[package]
name = "edgequake-pipeline"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Document processing pipeline for EdgeQuake"

[dependencies]
edgequake-storage = { path = "../edgequake-storage" }
edgequake-llm = { workspace = true }

# Direct HTTP client for the multimodal embedding path
# (MultimodalEmbeddingClient). Calls an OpenAI-compat /v1/embeddings endpoint
# with content-parts arrays — the existing EmbeddingProvider trait in
# edgequake-llm only carries plain strings, so figure chunks (caption + PNG
# bytes) need this bypass.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"

async-trait.workspace = true
chrono = { version = "0.4", features = ["serde"] }
tokio = { workspace = true, features = ["full"] }
tokio-util = "0.7"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
futures = "0.3"
regex = "1.10"
# Unicode normalization for text sanitization (SPEC-001/Issue-9)
unicode-normalization = "0.1"
# Context-aware markdown-aware chunking (used by algorithm extraction).
# `tiktoken-rs` feature lets us use a real BPE tokenizer as the chunk sizer,
# replacing the char/4 estimation used by `TokenBasedChunking`.
text-splitter = { version = "0.29", features = ["markdown", "tiktoken-rs"] }
# Accurate token counts for chunk sizing. cl100k_base is a reasonable
# approximation for any modern BPE tokenizer (Qwen, Llama, DeepSeek, …);
# within ~15-20% vs exact, vs ~50% error from char/4 on dense technical
# content. Workspace already uses tiktoken-rs, we just declare it direct.
tiktoken-rs = { workspace = true }
# Heading-path tracking: walk markdown headings, maintain a stack, emit
# the full path per chunk. Already transitive via edgequake-pdf2md; we
# declare direct so we don't rely on a transitive re-export.
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
