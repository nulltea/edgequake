[package]
name = "edgequake-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PDF to Markdown conversion backends for EdgeQuake"

[dependencies]
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
edgequake-llm = { workspace = true }
edgequake-pdf2md = "=0.8.0"
edgeparse-core = { workspace = true }
# VLM-OCR backend: layout detection (oar-ocr-core) + DocParser (oar-ocr-vl)
oar-ocr-vl = { version = "0.6", default-features = false }
oar-ocr-core = { version = "0.6" }
# Pure-Rust PDF rendering for VLM-OCR page rasterization.
hayro = "0.5"
# HTTP client for VlmClientBackend (OpenAI-compatible VLM server calls).
ureq = { version = "3", default-features = false, features = ["rustls"] }
image = "0.25"
rayon = "1.8"
base64 = "0.22"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
