services:
    edgequake:
        build:
            context: ..
            dockerfile: docker/Dockerfile
        container_name: edgequake
        restart: unless-stopped
        ports:
            - "${EDGEQUAKE_PORT:-8080}:8080"
        environment:
            EDGEQUAKE_HOST: 0.0.0.0
            EDGEQUAKE_PORT: "8080"
            DATABASE_URL: "postgres://edgequake:${POSTGRES_PASSWORD:-edgequake_secret}@postgres:5432/edgequake"

            EDGEQUAKE_MODELS_CONFIG: /config/models.toml

            EDGEQUAKE_LLM_PROVIDER: "${EDGEQUAKE_LLM_PROVIDER:-openai-compatible}"
            OPENAI_API_KEY: "${OPENAI_API_KEY:-dummy}"
            OPENAI_BASE_URL: "${OPENAI_BASE_URL:-http://host.docker.internal:11435/v1}"
            OPENAI_COMPATIBLE_BASE_URL: "${OPENAI_COMPATIBLE_BASE_URL:-https://ai.tail59ea6b.ts.net/v1}"

            EDGEQUAKE_EMBEDDING_PROVIDER: "${EDGEQUAKE_EMBEDDING_PROVIDER:-lmstudio}"
            LMSTUDIO_HOST: "${LMSTUDIO_HOST:-http://host.docker.internal:11439}"
            EDGEQUAKE_EMBEDDING_MODEL: "${EDGEQUAKE_EMBEDDING_MODEL:-qwen3-embedding-0.6b}"
            EDGEQUAKE_EMBEDDING_DIMENSION: "${EDGEQUAKE_EMBEDDING_DIMENSION:-1024}"

            EDGEQUAKE_VISION_TIMEOUT_SECS: "${EDGEQUAKE_VISION_TIMEOUT_SECS:-3600}"
            EDGEQUAKE_CHUNK_TIMEOUT_SECS: "${EDGEQUAKE_CHUNK_TIMEOUT_SECS:-1800}"
            EDGEQUAKE_PDF_CONCURRENCY: "${EDGEQUAKE_PDF_CONCURRENCY:-4}"
            EDGEQUAKE_PDF_DPI: "${EDGEQUAKE_PDF_DPI:-200}"
            EDGEQUAKE_LLM_TIMEOUT: "${EDGEQUAKE_LLM_TIMEOUT:-400}"
            EDGEQUAKE_EXTRACTION_CONCURRENCY: "${EDGEQUAKE_EXTRACTION_CONCURRENCY:-8}"
            EDGEQUAKE_ALGO_EXTRACTION_CONCURRENCY: "${EDGEQUAKE_ALGO_EXTRACTION_CONCURRENCY:-4}"
            MAX_TASKS_PER_TENANT: "${MAX_TASKS_PER_TENANT:-1}"
            EDGEQUAKE_OAR_OCR_MODEL_DIR: /var/cache/edgequake/oar-ocr-models
            RUST_LOG: "info,edgequake=debug"

            # Reference Code GraphRAG — Layer B fallback (empty-string → disabled).
            # Uses host.docker.internal to reach the user's host-side SearXNG/Crawl4AI.
            SEARXNG_URL: "${SEARXNG_URL:-http://host.docker.internal:8888}"
            CRAWL4AI_URL: "${CRAWL4AI_URL:-http://host.docker.internal:11235}"

            # Phase 1 — code-analyzer sidecar (algorithm localization in cloned repos).
            CODE_ANALYZER_URL: "${CODE_ANALYZER_URL:-http://code-analyzer:9100}"
            CODE_ANALYZER_WORKSPACE: /workspace

            # Phase 1 — code embedder (jina-code-embeddings via llama-server).
            # Both approval-time indexing and query-time semantic search use it.
            # Unset EDGEQUAKE_CODE_EMBEDDING_URL to disable the feature entirely.
            EDGEQUAKE_CODE_EMBEDDING_URL: "${EDGEQUAKE_CODE_EMBEDDING_URL:-http://host.docker.internal:8060/v1}"
            EDGEQUAKE_CODE_EMBEDDING_MODEL: "${EDGEQUAKE_CODE_EMBEDDING_MODEL:-jina-code-embeddings}"
            EDGEQUAKE_CODE_EMBEDDING_DIMENSION: "${EDGEQUAKE_CODE_EMBEDDING_DIMENSION:-896}"

            # Phase 2 — full reference-codebase RAG over the persisted clones.
            # The same code-analyzer-workspace volume is mounted read-only below.
            EDGEQUAKE_REFERENCE_CODEBASE_INDEXING: "${EDGEQUAKE_REFERENCE_CODEBASE_INDEXING:-off}"
            EDGEQUAKE_REFERENCE_CODEBASE_WORKSPACE: /workspace
            EDGEQUAKE_REFERENCE_CODEBASE_MODE: "${EDGEQUAKE_REFERENCE_CODEBASE_MODE:-algorithm_focused}"
            EDGEQUAKE_REFERENCE_CODEBASE_MAX_REPO_MB: "${EDGEQUAKE_REFERENCE_CODEBASE_MAX_REPO_MB:-500}"
            EDGEQUAKE_REFERENCE_CODEBASE_MAX_FILES: "${EDGEQUAKE_REFERENCE_CODEBASE_MAX_FILES:-25000}"
            EDGEQUAKE_REFERENCE_CODEBASE_MAX_FILE_BYTES: "${EDGEQUAKE_REFERENCE_CODEBASE_MAX_FILE_BYTES:-1048576}"
            EDGEQUAKE_REFERENCE_CODEBASE_MAX_CHUNKS: "${EDGEQUAKE_REFERENCE_CODEBASE_MAX_CHUNKS:-20000}"
            EDGEQUAKE_REFERENCE_CODEBASE_QUERY_LIMIT: "${EDGEQUAKE_REFERENCE_CODEBASE_QUERY_LIMIT:-12}"
            EDGEQUAKE_REFERENCE_CODEBASE_GRAPH_HOPS: "${EDGEQUAKE_REFERENCE_CODEBASE_GRAPH_HOPS:-1}"
            EDGEQUAKE_REFERENCE_CODEBASE_SCIP: "${EDGEQUAKE_REFERENCE_CODEBASE_SCIP:-off}"

            # Phase 2 auto-enqueue: fire a reference-codebase index task on
            # code_artifact approval. Default off so the manual POST path
            # stays the only trigger until we've seen the auto path stable.
            EDGEQUAKE_REFERENCE_CODEBASE_AUTO_INDEX: "${EDGEQUAKE_REFERENCE_CODEBASE_AUTO_INDEX:-false}"
            # Lower file cap when the indexer was auto-triggered — protects
            # against one click burning the whole Jina quota on a 20k-file
            # repo. Explicit POST /indexes calls aren't capped by this.
            EDGEQUAKE_REFERENCE_CODEBASE_AUTO_MAX_FILES: "${EDGEQUAKE_REFERENCE_CODEBASE_AUTO_MAX_FILES:-5000}"
            EDGEQUAKE_BM25_INDEX_DIR: "${EDGEQUAKE_BM25_INDEX_DIR:-/tmp/edgequake-bm25}"

            # Semantic (cross-encoder) reranker. Presence of RERANKER_URL
            # enables the option — workspaces opt in via the Reranking
            # Configuration UI card (reranker_strategy = "semantic").
            # Default points at llama-swap's local jina-reranker-v3 sidecar.
            RERANKER_URL: "${RERANKER_URL:-http://host.docker.internal:8060/v1/rerank}"
            RERANKER_MODEL: "${RERANKER_MODEL:-jina-reranker-v3}"
            # Long enough to cover cold-spawn (model load ~5-15s) + prefill
            # of a long joint rerank prompt on Strix Halo iGPU.
            RERANKER_TIMEOUT_SECS: "${RERANKER_TIMEOUT_SECS:-300}"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - edgequake-network
        volumes:
            - ${HOME}/.edgequake/models.toml:/config/models.toml:ro
            - ${HOME}/.edgequake/oar-ocr-models:/var/cache/edgequake/oar-ocr-models
            - ${LLAMACPP_MODEL_DIR:-$HOME/.cache/edgequake/llamacpp-models}:/var/cache/edgequake/llamacpp-models:ro
            - code-analyzer-workspace:/workspace:ro
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    code-analyzer:
        # Phase 1 of the Reference Code GraphRAG extension.
        # Locates algorithm implementations in cloned repos by driving the
        # `claude` CLI headless. See code-analyzer/README.md for setup.
        build:
            context: ../../code-analyzer
            dockerfile: Dockerfile
        container_name: code-analyzer
        restart: unless-stopped
        environment:
            # Subscription-backed auth (1-year token from `claude setup-token`).
            # Set in .env. Do NOT also set ANTHROPIC_API_KEY — it would
            # silently override and bill API credits instead of the sub.
            CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
            CODE_ANALYZER_PORT: "9100"
            CODE_ANALYZER_WORKSPACE: /workspace
            # Default Claude model. Pinned to "sonnet" to keep localization off
            # the Opus quota; per-request override via AnalyzeRequest.model still
            # wins. Set to "opus" / "haiku" / full model id as needed.
            CODE_ANALYZER_DEFAULT_MODEL: "${CODE_ANALYZER_DEFAULT_MODEL:-sonnet}"
            LOG_LEVEL: "${CODE_ANALYZER_LOG_LEVEL:-INFO}"
        ports:
            - "${CODE_ANALYZER_PORT:-9100}:9100"
        networks:
            - edgequake-network
        volumes:
            - code-analyzer-workspace:/workspace
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    frontend:
        build:
            context: ../../
            dockerfile: edgequake_webui/Dockerfile
            args:
                NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
        container_name: edgequake-frontend
        restart: unless-stopped
        ports:
            - "${FRONTEND_PORT:-3000}:3000"
        environment:
            NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
            NODE_ENV: production
        depends_on:
            edgequake:
                condition: service_started
        networks:
            - edgequake-network
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--no-verbose",
                    "--tries=1",
                    "--spider",
                    "http://localhost:3000",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    postgres:
        build:
            context: .
            dockerfile: Dockerfile.postgres
        container_name: edgequake-postgres
        restart: unless-stopped
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        environment:
            POSTGRES_USER: edgequake
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-edgequake_secret}"
            POSTGRES_DB: edgequake
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./init-extensions.sql:/docker-entrypoint-initdb.d/init.sql:ro
        networks:
            - edgequake-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U edgequake -d edgequake"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

volumes:
    postgres-data:
    code-analyzer-workspace:

networks:
    edgequake-network:
        driver: bridge
